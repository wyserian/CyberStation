<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="CyberStation - A comprehensive collection of cybersecurity tools and resources">
    <title>The CyberStation - Cybersecurity Tools Collection</title>
    <!-- Dark-only: lets the browser paint the dark background before the stylesheet loads -->
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#090d15">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.min.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Skip to content for accessibility -->
    <a href="#dataList" class="skip-link">Skip to content</a>

    <!-- Loading Overlay with Shimmer -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="skeleton-container">
            <div class="skeleton-search shimmer"></div>
            <div class="skeleton-filters shimmer"></div>
            <div class="skeleton-cards">
                <div class="skeleton-card shimmer"></div>
                <div class="skeleton-card shimmer"></div>
                <div class="skeleton-card shimmer"></div>
                <div class="skeleton-card shimmer"></div>
                <div class="skeleton-card shimmer"></div>
                <div class="skeleton-card shimmer"></div>
            </div>
        </div>
    </div>

    <main>
        <div class="container-fluid">
            <!-- Toolbar: Share, GitHub -->
            <div class="toolbar">
                <button id="shareBtn" class="btn-toolbar" aria-label="Share" title="Share filtered results">
                    <i class="bi bi-share"></i>
                </button>
                <a href="https://github.com/wyserian/CyberStation" target="_blank" rel="noopener noreferrer" class="btn-toolbar" aria-label="View on GitHub" title="View on GitHub">
                    <i class="bi bi-github"></i>
                </a>
            </div>

            <!-- Search Box with Autocomplete -->
            <div class="search-wrapper">
                <div class="search-box">
                    <div class="search-icon">
                        <i class="bi bi-search"></i>
                    </div>
                    <input 
                        type="text" 
                        id="search" 
                        placeholder="Search tools by name or description..." 
                        aria-label="Search tools"
                        aria-keyshortcuts="/"
                        autocomplete="off"
                    >
                    <kbd class="keyboard-hint" title="Press / to search" aria-hidden="true">/</kbd>
                    <button id="clearSearch" class="btn-clear-search" aria-label="Clear search" style="display: none;">
                        <i class="bi bi-x-circle-fill"></i>
                    </button>
                </div>
                <div id="autocomplete" class="autocomplete-dropdown" style="display: none;"></div>
            </div>

            <!-- Active Filter Chips -->
            <div id="activeChips" class="active-chips" style="display: none;">
                <div class="chips-container"></div>
                <button id="clearAllFilters" class="btn-clear-all">
                    <i class="bi bi-x-circle"></i> Clear All
                </button>
            </div>

            <!-- Filter Section -->
            <section id="filters" class="filter-box">
                <!-- Filters will be generated dynamically -->
            </section>

            <!-- Results Info -->
            <div class="results-info">
                <span id="resultsCount" role="status" aria-live="polite">Loading tools…</span>
            </div>

            <!-- Recently Viewed -->
            <div id="recentlyViewed" class="recently-viewed" style="display: none;">
                <h6><i class="bi bi-clock-history"></i> Recently Viewed</h6>
                <div class="recent-items" id="recentItems"></div>
            </div>

            <!-- No Results Message -->
            <div id="noResults" class="no-results" style="display: none;">
                <div class="empty-state">
                    <h4>No tools found</h4>
                    <p>Try adjusting your search or filters</p>
                    <button id="resetFromEmpty" class="btn-toolbar">
                        <i class="bi bi-arrow-clockwise"></i> Reset Filters
                    </button>
                </div>
            </div>

            <!-- Tool cards -->
            <section id="dataList" class="lists" role="list">
                <!-- Tool cards will be rendered here -->
            </section>

            <!-- Back to Top Button -->
            <button id="backToTop" class="btn-back-to-top" aria-label="Back to top">
                <i class="bi bi-arrow-up"></i>
            </button>
        </div>
    </main>

    <!-- Custom JS -->
    <script src="js/script.min.js"></script>
</body>
</html>
